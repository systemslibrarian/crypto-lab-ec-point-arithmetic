name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26.0.0 and
      # pulls undici 8, which needs the newer runtime -- on Node 20 every jsdom
      # test worker died with `webidl.util.markAsUncloneable is not a function`
      # before collecting a single test. Node 20 also went out of support in
      # April 2026. Matches the labs already on jsdom 30 (curve-lens,
      # phantom-vault, stark-tower).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs both browser specs: the axe-core WCAG A/AA scan and the functional
      # claims spec that asserts every verdict, counter and edge case in a real
      # browser. Both are blocking.
      - name: Browser gate (axe-core WCAG A/AA + rendered claims)
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
