name: Deploy to GitHub Pages

# One workflow, one gate. This lab used to split them: ci.yml ran npm ci, lint,
# the unit tests and the build on pull_request, and deploy.yml ran all of that
# PLUS the browser gate -- the axe WCAG A/AA scan and the rendered-claims e2e
# suite -- on push to main. Dependabot's auto-merge hung off ci.yml, the lighter
# of the two. So a bump only had to satisfy lint/test/build to merge itself, and
# the browser gate then failed on the merge commit: the PR was green, the merge
# was clean, the deploy was blocked, and main quietly stopped shipping. Nothing
# goes red in between, because staleness is not a state anything reports.
#
# So the gate a bump merges against is now literally the gate the deploy runs --
# one `build` job, depended on by both `deploy` and `dependabot-auto-merge`.
# ci.yml is deleted rather than kept beside it: a second copy of a gate is how
# the two drifted apart in the first place.
on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait
  # on. `branches: [main]` copies ci.yml's filter exactly -- widening or
  # narrowing it here would change what a pull request is judged by.
  pull_request:
    branches: [main]
  # Required by the post-merge dispatch at the bottom of this file.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`. Now that pull_request is a trigger and
  # cancel-in-progress is on, a bare group would let a PR run cancel a live main
  # deploy -- and `cancelled` is one of the shapes that ships nothing while
  # looking like nothing went wrong.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26.0.0 and
      # pulls undici 8, which needs the newer runtime -- on Node 20 every jsdom
      # test worker died with `webidl.util.markAsUncloneable is not a function`
      # before collecting a single test. Node 20 also went out of support in
      # April 2026. Matches the labs already on jsdom 30 (curve-lens,
      # phantom-vault, stark-tower).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Two tools in one script: `npm run lint` is `eslint . && prettier --check .`.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs both browser specs: the axe-core WCAG A/AA scan and the functional
      # claims spec that asserts every verdict, counter and edge case in a real
      # browser. Both are blocking.
      - name: Browser gate (axe-core WCAG A/AA + rendered claims)
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # A pull request is gated, never published. `!= 'pull_request'` and NOT
    # `== 'push'`: the latter reads as equivalent and also skips
    # workflow_dispatch, which is the one trigger the post-merge dispatch below
    # depends on -- the dispatched run would check out, build, pass the whole
    # gate, skip this job, and leave the site exactly as stale as it was. That is
    # not hypothetical here: ab658af fixed exactly that on this repo, having
    # first verified it on a real run (build=success, deploy=SKIPPED).
    #
    # Note this is safe to gate only because build and deploy are separate jobs.
    # Where they are one job, gating it off for pull requests disables the PR
    # gate itself, so the PR runs nothing and reports nothing.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument, and it is the
  # SAME build job `deploy` needs -- not a copy of it -- so a bump cannot merge
  # unless the thing that would later block the deploy has already gone green on
  # the PR. Majors are excluded from the dependabot groups: the 2026-08-18 batch
  # had to hold back 109 bumps and they were overwhelmingly majors (@noble v2
  # dropped export subpaths, TypeScript 7, vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- lint, unit tests, build, axe WCAG and the
      # e2e claims -- judges a bump far better than its version number does. A
      # major that actually breaks this lab fails the gate and stays open for a
      # human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # The filename below has to be the one THIS repo has. It is deploy.yml here,
          # and after the ci.yml deletion it is the only workflow file in the repo --
          # so the dispatch names the file that carries the very gate it re-runs. Some
          # labs have deploy-pages.yml or pages.yml; copying a reference lab verbatim
          # gives a 404 that fails only on the auto-merge path, only after the merge
          # has already landed -- the same silent non-deploy this step exists to stop.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
